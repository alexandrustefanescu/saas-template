<!doctype html>
<html lang="en" data-background="base" data-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dashboard</title>
    <!--
      Establish cascade layer order before Vite injects CSS.
      Spectrum's `_` must come after Tailwind so S2 components are not reset.
    -->
    <style>
      @layer theme, base, components, utilities, _;
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
